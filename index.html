<!DOCTYPE html>
<html lang="pt-BR" data-papel="creme" data-cantos="suave" data-fonte="manuscrita" data-decor="plantas">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gege Post-it</title>
<style>
:root {
  --esc: 1;
  --fonte-man: "Ink Free", "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive;
  --fonte-txt: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  --fonte: var(--fonte-man);
  --lh: 2em;
  --alerta: #C9706B;
  --c1: #6C9BC9; --c2: #7FB28E; --c3: #D49A6A; --c4: #A58BC9; --c5: #66B3B0; --c6: #9A9A9A;
  /* papel padrão: creme */
  --papel: #FFFDF6; --linha: #D8E6EF; --margem: #F1BDB8; --tinta: #3F3B35; --suave: #8C867A; --destaque: #D98E8E; --sobre: #FFFFFF;
  --r: .6em; --rp: 99em;
  --campo: color-mix(in srgb, var(--papel) 55%, #fff);
}
html { font-size: calc(15px * var(--esc)); }
html[data-fonte="normal"] { --fonte: var(--fonte-txt); }
html[data-cantos="reto"]   { --r: 0;     --rp: 0; }
html[data-cantos="suave"]  { --r: .6em;  --rp: 99em; }
html[data-cantos="redondo"]{ --r: 1.2em; --rp: 99em; }

html[data-papel="rosa"]    { --papel:#FFF2F4; --linha:#F6D8DE; --margem:#F2AAB7; --destaque:#D9728A; --tinta:#4A3B3F; --suave:#957E84; }
html[data-papel="lavanda"] { --papel:#F7F3FF; --linha:#DFD6F3; --margem:#CBBBEC; --destaque:#9C82D4; --tinta:#3F3A4F; --suave:#8A84A0; }
html[data-papel="menta"]   { --papel:#F1FAF5; --linha:#CFE8DB; --margem:#AADCC0; --destaque:#5FAE86; --tinta:#34413A; --suave:#7B8F84; }
html[data-papel="pessego"] { --papel:#FFF5EB; --linha:#F6E0CC; --margem:#F3BF9A; --destaque:#E8935F; --tinta:#4A3E34; --suave:#977F6B; }
html[data-papel="ceu"]     { --papel:#F0F8FF; --linha:#D0E4F5; --margem:#AACCEF; --destaque:#5B9BD5; --tinta:#33404D; --suave:#788CA0; }
html[data-papel="noite"]   { --campo: color-mix(in srgb, var(--papel) 86%, #fff); --papel:#2C303C; --linha:#3B4151; --margem:#6E5E80; --destaque:#E6B8D0; --tinta:#ECEAF2; --suave:#A9A7B8; --sobre:#2C303C; --alerta:#F08C86;
  --c1:#8DB6DE; --c2:#8FCB9F; --c3:#E6B085; --c4:#BBA3DD; --c5:#7CC6C2; --c6:#B5B5B5; }

/* etiquetas (categorias) acompanham a cor do tema */
html[data-papel="rosa"]    { --c1:#D9728A; --c2:#C26A9C; --c3:#E08A7A; --c4:#B97AA8; --c5:#D98BA0; --c6:#A8808C; }
html[data-papel="lavanda"] { --c1:#9C82D4; --c2:#7F8FD6; --c3:#B57AC2; --c4:#8F7AB8; --c5:#7AA3D0; --c6:#9A93AD; }
html[data-papel="menta"]   { --c1:#5FAE86; --c2:#6BB3A0; --c3:#8DB86A; --c4:#4F9C94; --c5:#79A875; --c6:#7E9A8A; }
html[data-papel="pessego"] { --c1:#E8935F; --c2:#D9A441; --c3:#C9786B; --c4:#B58A5E; --c5:#D98F7A; --c6:#A38670; }
html[data-papel="ceu"]     { --c1:#5B9BD5; --c2:#5FB0C9; --c3:#7A8FD0; --c4:#4F86B8; --c5:#6AA7B5; --c6:#8397A8; }

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body { background: color-mix(in srgb, var(--papel) 78%, #8a7f6a); color: var(--tinta); font-family: var(--fonte); font-size: 1rem; }
button, input, select { font-family: inherit; font-size: inherit; color: inherit; }

/* ---------- folha de caderno ---------- */
.folha {
  position: relative; display: flex; flex-direction: column;
  max-width: 34em; height: calc(100vh - 2em); margin: 1em auto;
  background: var(--papel); border-radius: var(--r);
  box-shadow: 0 .15em .9em rgba(60, 50, 30, .22); overflow: hidden;
}
body.app { background: var(--papel); }
body.app .folha, body.pip .folha { max-width: none; height: 100vh; margin: 0; border-radius: 0; box-shadow: none; }
.folha::before {                       /* furinhos da espiral */
  content: ""; position: absolute; left: .55em; top: 0; bottom: 0; width: 1.3em; z-index: 2; pointer-events: none;
  background: radial-gradient(circle at 50% 50%, color-mix(in srgb, var(--papel) 70%, #6b6558) 0 .3em, rgba(0,0,0,.10) .32em .4em, transparent .44em) 0 .6em / 1.3em 2.4em repeat-y;
}
.folha::after {                        /* margem vermelha */
  content: ""; position: absolute; left: 3em; top: 0; bottom: 0; width: 1px; background: var(--margem); opacity: .9; pointer-events: none; z-index: 1;
}
.topo { position: relative; z-index: 3; display: flex; align-items: center; gap: .6em; padding: .9em 1em .5em 3.5em; flex: none; }
.saudacao { flex: 1; min-width: 0; }
.tit { margin: 0; font-size: 1.25em; font-weight: 600; line-height: 1.15; overflow-wrap: anywhere; }
.sub { font-size: .8em; color: var(--suave); margin-top: .15em; }
.ilu { flex: none; width: 5em; height: 3.7em; color: var(--destaque); display: block; }
html[data-decor="nenhum"] .ilu, html[data-decor="nenhum"] .base-deco { display: none; }
.ctrl { display: flex; gap: .25em; flex: none; align-self: flex-start; }
.ico { cursor: pointer; background: transparent; border: 1px solid transparent; color: var(--suave); border-radius: var(--rp); width: 1.9em; height: 1.9em; line-height: 1; padding: 0; }
.ico:hover, .ico.ativo { background: color-mix(in srgb, var(--destaque) 20%, transparent); color: var(--tinta); }
.drag { -webkit-app-region: drag; }
.ctrl, .ctrl *, input, select, button, .corpo, .abas, .painel { -webkit-app-region: no-drag; }
.so-app { display: none; }
body.app .so-app { display: inline-block; }
body.app .linha-aj.so-app { display: flex; }

.corpo {
  position: relative; z-index: 3; flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; scrollbar-width: thin;
  padding: .2em 1em 1em 3.5em;
  background-image: repeating-linear-gradient(to bottom, transparent 0, transparent calc(var(--lh) - 1px), color-mix(in srgb, var(--linha) 65%, transparent) calc(var(--lh) - 1px), color-mix(in srgb, var(--linha) 65%, transparent) var(--lh));
  background-attachment: local;
}
@media (max-width: 330px) {
  .folha::before { left: .3em; width: 1em; } .folha::after { left: 2.2em; }
  .topo { padding-left: 2.6em; } .corpo { padding-left: 2.6em; padding-right: .6em; } .ilu { display: none; } .rodape { padding-left: 3.34em; padding-right: .8em; }
  .linha-add .btn { padding: .3em .6em; }
}

.progresso { margin: .1em 0 .5em; }
.barra { height: .45em; background: color-mix(in srgb, var(--linha) 80%, transparent); border-radius: 1em; overflow: hidden; }
.barra span { display: block; height: 100%; width: 0; background: var(--destaque); border-radius: 1em; transition: width .35s; }
.prog-txt { font-size: .78em; color: var(--suave); margin-top: .2em; }

.abas { display: flex; flex-wrap: wrap; gap: .35em; margin: .2em 0 .6em; }
.aba { cursor: pointer; background: var(--campo); border: 1px solid var(--linha); color: var(--suave); border-radius: var(--rp); padding: .1em .8em; }
.aba[aria-selected="true"] { background: var(--destaque); border-color: var(--destaque); color: var(--sobre); }
.aba .n { font-size: .8em; margin-left: .3em; opacity: .85; }

/* ---------- painel de ajustes ---------- */
.painel { border: 1px dashed var(--margem); border-radius: var(--r); padding: .6em .8em; margin: .2em 0 .7em; display: grid; gap: .55em; background: var(--campo); }
.painel[hidden] { display: none; }
.linha-aj { display: flex; align-items: center; gap: .6em; flex-wrap: wrap; }
.linha-aj > span { width: 6em; font-size: .82em; color: var(--suave); flex: none; }
.linha-aj input[type=range] { flex: 1; min-width: 5em; accent-color: var(--destaque); }
.opts { display: flex; flex-wrap: wrap; gap: .3em; }
.opt { cursor: pointer; background: transparent; border: 1px solid var(--linha); border-radius: var(--rp); padding: .05em .7em; font-size: .85em; color: var(--tinta); }
.opt[aria-pressed="true"] { background: var(--destaque); border-color: var(--destaque); color: var(--sobre); }
.sw { width: 1.5em; height: 1.5em; border-radius: 50%; border: 2px solid transparent; box-shadow: 0 0 0 1px rgba(0,0,0,.15) inset; cursor: pointer; padding: 0; }
.sw[aria-pressed="true"] { border-color: var(--tinta); }

/* ---------- formulário ---------- */
.form { display: grid; grid-template-columns: minmax(0, 1fr); gap: .45em; margin-bottom: .6em; }
.linha-add { display: flex; gap: .4em; }
.form input[type=text], .form input[type=date], .notas .linha-add input, .e-titulo, .e-datas input {
  background: var(--campo); border: 1px solid var(--linha); border-radius: var(--r); padding: .35em .65em; min-width: 0; color: var(--tinta);
}
html[data-papel="noite"] { color-scheme: dark; }
.form input:focus, .notas .linha-add input:focus, .e-titulo:focus, .e-datas input:focus { outline: 2px solid color-mix(in srgb, var(--destaque) 60%, transparent); outline-offset: 0; }
.linha-add input { flex: 1; min-width: 0; }
.linha-add .btn { flex: none; }
.btn { cursor: pointer; background: var(--destaque); color: var(--sobre); border: 1px solid var(--destaque); border-radius: var(--r); padding: .3em .9em; }
.btn.suave { background: transparent; color: var(--tinta); border-color: var(--linha); }
.btn:hover { filter: brightness(.96); }
.cats, .e-cats { display: flex; flex-wrap: wrap; gap: .3em; }
.chip { cursor: pointer; background: transparent; color: var(--c); border: 1px solid var(--c); border-radius: var(--rp); padding: 0 .7em; font-size: .82em; line-height: 1.6; }
.chip[aria-pressed="true"] { background: var(--c); color: var(--sobre); }
.datas, .e-datas { display: flex; gap: .5em; flex-wrap: wrap; }
.datas label, .e-datas label { flex: 1 1 7em; min-width: 0; font-size: .78em; color: var(--suave); display: flex; flex-direction: column; gap: .1em; }
.datas input, .e-datas input { font-size: 1.1em; width: 100%; min-width: 0; }

/* ---------- tarefas ---------- */
.lista { display: flex; flex-direction: column; min-width: 0; }
.vazio { color: var(--suave); text-align: center; padding: 1.2em .4em; font-size: .95em; }
.tarefa { display: flex; align-items: flex-start; gap: .6em; padding: .4em 0 .35em; border-bottom: 1px dotted color-mix(in srgb, var(--linha) 70%, transparent); }
.bola {
  appearance: none; -webkit-appearance: none; flex: none; position: relative; cursor: pointer; margin: .12em 0 0;
  width: 1.35em; height: 1.35em; border: 1.6px solid var(--destaque); border-radius: 50%; background: transparent; transition: background .15s, transform .15s;
}
.bola:hover { background: color-mix(in srgb, var(--destaque) 20%, transparent); }
.bola:checked { background: var(--destaque); transform: scale(1.04); }
.bola:checked::after { content: ""; position: absolute; left: 33%; top: 12%; width: 30%; height: 54%; border: solid var(--sobre); border-width: 0 .14em .14em 0; transform: rotate(42deg); }
.miolo { flex: 1; min-width: 0; }
.nome { font-size: 1.02em; line-height: 1.3; overflow-wrap: anywhere; cursor: text; }
.feito .nome { text-decoration: line-through; color: var(--suave); }
.feito { opacity: .7; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: .2em .5em; font-size: .78em; color: var(--suave); margin-top: .1em; }
.cat { display: inline-block; color: var(--c); background: color-mix(in srgb, var(--c) 16%, transparent); border-radius: var(--rp); padding: 0 .6em; line-height: 1.55; }
.atraso { color: var(--alerta); }
.mini { flex: none; cursor: pointer; background: transparent; border: 0; color: var(--suave); opacity: .5; width: 1.6em; height: 1.6em; border-radius: var(--rp); padding: 0; line-height: 1; }
.mini:hover { opacity: 1; background: color-mix(in srgb, var(--destaque) 18%, transparent); }
.editando { flex-direction: column; background: var(--campo); border: 1px solid var(--linha); border-radius: var(--r); padding: .6em; margin: .3em 0; gap: .5em; }
.editando .e-titulo { width: 100%; }
.e-botoes { display: flex; gap: .4em; flex-wrap: wrap; }
.limpar { cursor: pointer; background: none; border: 0; color: var(--suave); text-decoration: underline; padding: 0; font-size: .82em; }
.resumo-linha { display: flex; justify-content: space-between; align-items: center; min-height: 1.5em; margin: 0 0 .2em; font-size: .82em; color: var(--suave); }

.rodape { flex: none; position: relative; z-index: 3; margin-top: 1.4em; padding: .7em 1.3em .75em 4.49em; font-size: .78em; color: var(--suave);
  border-top: 1px dashed var(--margem); background: var(--papel); }
.rodape-linha { display: flex; align-items: center; justify-content: space-between; gap: .6em; flex-wrap: wrap; }
.aviso { margin: .1em 0 .5em; font-size: .8em; color: var(--suave); }
.aviso:empty { display: none; }
.lista { margin-bottom: 1.6em; }
.rodape-app { display: none; align-items: center; gap: .4em; margin-top: .3em; }
body.app .rodape-app { display: flex; }
.ver { display: none; }
body.app .ver { display: block; }
.base-deco { display: flex; gap: .5em; justify-content: flex-end; margin-left: auto; color: var(--destaque); opacity: .55; }
.base-deco svg { width: 1.3em; height: 1.3em; }
.upd { display: none; align-items: center; justify-content: space-between; gap: .5em; margin: 0 0 .5em; padding: .5em .7em; background: color-mix(in srgb, var(--destaque) 14%, var(--papel)); border-radius: var(--r); border: 1px solid var(--destaque); }
.upd.on { display: flex; }
.fixado-msg { max-width: 34em; margin: 1em auto; padding: 1.2em; text-align: center; color: var(--suave); }
.fixado-msg[hidden] { display: none; }

/* ---------- várias folhas ---------- */
.so-tar, .so-lemb { }
body[data-tipo="lembretes"] .so-tar { display: none !important; }
body[data-tipo="tarefas"] .so-lemb, body[data-tipo="recados"] .so-lemb { display: none !important; }
.recado { display: none; flex: 1; min-height: 10em; width: 100%; resize: none; border: 0; outline: 0; background: transparent; color: var(--tinta);
  font: inherit; line-height: var(--lh); padding: 0; overflow: auto; scrollbar-width: thin; }
.recado::placeholder { color: var(--suave); opacity: .8; }
body[data-tipo="recados"] .recado { display: block; }
body[data-tipo="recados"] .progresso, body[data-tipo="recados"] .abas, body[data-tipo="recados"] .form,
body[data-tipo="recados"] .resumo-linha, body[data-tipo="recados"] .lista { display: none; }
body[data-tipo="recados"] .corpo { display: flex; flex-direction: column; padding-top: 0; }
/* ---------- bloco de notas ---------- */
.notas { display: none; }
body[data-tipo="notas"] .notas { display: block; }
body[data-tipo="notas"] .progresso, body[data-tipo="notas"] .abas, body[data-tipo="notas"] .form,
body[data-tipo="notas"] .resumo-linha, body[data-tipo="notas"] .lista, body[data-tipo="notas"] .recado { display: none; }
.nota-resumo { margin: .1em 0 .3em; font-size: .82em; color: var(--suave); }
.nota-item { border-bottom: 1px dotted color-mix(in srgb, var(--linha) 70%, transparent); }
.nota-cab { display: flex; align-items: center; gap: .5em; padding: .4em 0; cursor: pointer; }
.nota-cab .seta { flex: none; width: 1em; text-align: center; color: var(--destaque); }
.nota-titulo { flex: 1; min-width: 0; font-size: 1.05em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nota-item.aberta .nota-titulo { font-weight: 600; }
.nota-texto { display: block; width: 100%; min-height: 5em; margin: .1em 0 .7em; padding: .45em .65em; border: 1px solid var(--linha); border-radius: var(--r);
  background: var(--campo); color: var(--tinta); font: inherit; line-height: 1.5; resize: none; outline: 0; overflow: hidden; }
.nota-texto:focus, .nota-edit:focus { outline: 2px solid color-mix(in srgb, var(--destaque) 60%, transparent); }
.nota-edit { flex: 1; min-width: 0; background: var(--campo); border: 1px solid var(--linha); border-radius: var(--r); padding: .25em .55em; color: var(--tinta); font: inherit; }
.menu { position: absolute; top: 3.4em; right: .8em; z-index: 20; min-width: 15em; max-width: calc(100% - 1.6em); background: var(--papel);
  border: 1px solid var(--margem); border-radius: var(--r); box-shadow: 0 .3em 1.2em rgba(0,0,0,.28); padding: .5em; display: grid; gap: .15em; }
.menu[hidden] { display: none; }
.menu h4 { margin: .2em .4em; font-size: .78em; font-weight: 600; color: var(--suave); }
.menu hr { border: 0; border-top: 1px dashed var(--linha); margin: .3em 0; width: 100%; }
.menu-linha { display: flex; align-items: center; gap: .2em; }
.menu-item { display: flex; align-items: center; gap: .4em; width: 100%; text-align: left; cursor: pointer; background: none; border: 0; padding: .25em .45em; border-radius: var(--r); color: var(--tinta); }
.menu-item:hover { background: color-mix(in srgb, var(--destaque) 16%, transparent); }
.menu-item .mn { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.menu-item .st { font-size: .72em; color: var(--suave); margin-left: auto; }
.linha-aj input[type=text] { flex: 1; min-width: 5em; background: var(--campo); border: 1px solid var(--linha); border-radius: var(--r); padding: .2em .55em; color: var(--tinta); }
</style>
</head>

    </symbol>
    <symbol id="mini-pata" viewBox="0 0 20 20" fill="currentColor"><path d="M10 10.5 c-3.2 0-5.6 2.2-5.6 4.2 s2.2 3 5.6 3 5.6-1 5.6-3 -2.4-4.2-5.6-4.2z"/><circle cx="3.6" cy="8" r="2"/><circle cx="7.6" cy="4.2" r="2"/><circle cx="12.4" cy="4.2" r="2"/><circle cx="16.4" cy="8" r="2"/></symbol>

  </defs>

<div class="fixado-msg" id="fixadoMsg" hidden>📌 O post-it está na janela flutuante.<br>Feche-a para trazê-lo de volta aqui.</div>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const app = $('app');
  const IDX = 'postit-indice', OLD = 'postit-demandas-v1';
  const FK = (id) => 'postit-folha-' + id;
  const App = window.postit || null;
  const USUARIA = 'Gessyca';
  const TIPOS = {
    tarefas:   { nome: 'Tarefas',   icone: '✅', papel: 'creme' },
    recados:   { nome: 'Recados',   icone: '📝', papel: 'pessego' },
    lembretes: { nome: 'Lembretes', icone: '🔔', papel: 'rosa' },
    notas:     { nome: 'Notas',     icone: '🗒️', papel: 'ceu' }
  };
  const CATS = [['Orçamento','--c1'],['Zeev','--c2'],['Reunião','--c3'],['Planejamento','--c4'],['Análise','--c5'],['Outros','--c6']];
  const corCat = (n) => (CATS.find(c => c[0] === n) || [])[1];
  const PAPEIS = [['creme','#FFFDF6','Creme'],['rosa','#FFE3E8','Rosa'],['lavanda','#E9E0FA','Lavanda'],['menta','#DDF3E6','Menta'],['pessego','#FFE6D2','Pêssego'],['ceu','#DCEEFC','Céu'],['noite','#2C303C','Noite']];
  const DECORS = [['nenhum','Nenhum'],['plantas','🌿 Plantas'],['corujas','🦉 Corujas'],['cachorros','🐶 Cachorros']];
  const ILU = { plantas: ['#planta', '#folha-m', '#folha-m', '#folha-m'], corujas: ['#coruja', '#mini-pena', '#mini-pena', '#mini-pena'], cachorros: ['#cao', '#mini-pata', '#mini-pata', '#mini-pata'] };
  const TEMA_PAPEL = { nenhum: 'creme', plantas: 'menta', corujas: 'lavanda', cachorros: 'pessego' };
  const CANTOS = [['reto','Retos'],['suave','Suaves'],['redondo','Bem redondos']];
  const FONTES = [['manuscrita','Manuscrita'],['normal','Normal']];

  // ---------- datas ----------
  const toISO = (d) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  const hojeISO = () => toISO(new Date());
  const nowHM = () => { const d = new Date(); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
  const addDias = (iso, n) => { const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + n); return toISO(d); };
  const segundaISO = () => { const d = new Date(); return addDias(toISO(d), -((d.getDay() + 6) % 7)); };
  const fmtData = (iso) => iso ? iso.slice(8, 10) + '/' + iso.slice(5, 7) : '';
  const diasEntre = (a, b) => Math.round((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 86400000);
  const ordenaDatas = (ini, fim) => (ini && fim && fim < ini) ? [fim, ini] : [ini, fim];
  const esc = (s) => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  // ---------- armazenamento (uma chave por folha + um índice) ----------
  const lerJ = (k) => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
  const gravarJ = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
  const lerIndice = () => { const i = lerJ(IDX); return Array.isArray(i) ? i : []; };
  const cfgPadrao = () => ({ escala: 100, papel: 'creme', decor: 'plantas', cantos: 'suave', fonte: 'manuscrita' });
  function migrar(s) {            // dados das versões anteriores
    if (s && s.v === 2) { s.cfg = Object.assign(cfgPadrao(), s.cfg || {}); return s; }
    const base = segundaISO();
    const tarefas = ((s && s.tarefas) || []).map(t => {
      let ini = '', fim = '';
      if (t.dia >= 1 && t.dia <= 6) ini = fim = addDias(base, t.dia - 1);
      return { id: t.id, titulo: t.titulo, cat: t.cat || null, ini, fim, feito: !!t.feito };
    });
    return { v: 2, tarefas, seq: (s && s.seq) || (tarefas.reduce((m, t) => Math.max(m, t.id), 0) + 1), filtro: 'hoje', cfg: cfgPadrao() };
  }
  function novaFolha(tipo) {
    const id = 'f' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
    const F = { id, tipo, nome: TIPOS[tipo].nome, cfg: Object.assign(cfgPadrao(), { papel: TIPOS[tipo].papel }), tarefas: [], seq: 1, filtro: 'hoje', texto: '', notas: [], seqN: 1 };
    gravarJ(FK(id), F);
    const ix = lerIndice(); ix.push({ id, tipo, nome: F.nome }); gravarJ(IDX, ix);
    return F;
  }
  function iniciarFolha() {
    let ix = lerIndice();
    if (!ix.length) {              // primeira vez: traz o que já existia para a folha "Tarefas"
      const antigo = lerJ(OLD);
      const b = migrar(antigo && Array.isArray(antigo.tarefas) ? antigo : { tarefas: [] });
      gravarJ(FK('f1'), { id: 'f1', tipo: 'tarefas', nome: 'Tarefas', cfg: b.cfg, tarefas: b.tarefas, seq: b.seq, filtro: b.filtro || 'hoje', texto: '' });
      ix = [{ id: 'f1', tipo: 'tarefas', nome: 'Tarefas' }]; gravarJ(IDX, ix);
    }
    let id = new URLSearchParams(location.search).get('folha');
    if (!id || !lerJ(FK(id))) id = ix[0].id;
    const F = lerJ(FK(id));
    F.cfg = Object.assign(cfgPadrao(), F.cfg || {});
    F.tarefas = F.tarefas || []; F.seq = F.seq || 1; F.texto = F.texto || '';
    F.notas = F.notas || []; F.seqN = F.seqN || 1;
    return F;
  }
  const F = iniciarFolha();
  const tipo = F.tipo;
  const state = F;
  const salvar = () => { if (lerIndice().some(i => i.id === F.id)) gravarJ(FK(F.id), F); };   // não recria folha já excluída
  function syncIndice() { const ix = lerIndice(); const i = ix.find(x => x.id === F.id); if (i && i.nome !== F.nome) { i.nome = F.nome; gravarJ(IDX, ix); } }
  const FILTROS = tipo === 'lembretes'
    ? [['hoje','Hoje'],['proximos','Próximos'],['tudo','Todos'],['feitas','Feitos']]
    : [['hoje','Hoje'],['semana','Semana'],['tudo','Tudo'],['feitas','Feitas']];
  if (!FILTROS.some(f => f[0] === state.filtro)) state.filtro = 'hoje';
  document.body.dataset.tipo = tipo;
  let catSel = null, editId = null, editCat = null, editNotaId = null, tmNota = null;

  // ---------- aparência ----------
  function aplicarCfg() {
    const c = state.cfg, r = document.documentElement;
    r.style.setProperty('--esc', c.escala / 100);
    r.dataset.papel = c.papel; r.dataset.cantos = c.cantos; r.dataset.fonte = c.fonte; r.dataset.decor = c.decor;
    const il = ILU[c.decor] || ILU.plantas;
    $('iluUse').setAttribute('href', il[0]);
    ['mini1', 'mini2', 'mini3'].forEach((id, i) => $(id).setAttribute('href', il[i + 1]));
    $('rEsc').value = c.escala; $('vEsc').textContent = c.escala + '%';
    $('swPapel').innerHTML = PAPEIS.map(([k, cor, nome]) => `<button class="sw" data-cfg="papel:${k}" title="${nome}" style="background:${cor}" aria-pressed="${c.papel === k}"></button>`).join('');
    const opts = (lista, chave) => lista.map(([k, nome]) => `<button class="opt" data-cfg="${chave}:${k}" aria-pressed="${c[chave] === k}">${nome}</button>`).join('');
    $('optDecor').innerHTML = opts(DECORS, 'decor');
    $('optCantos').innerHTML = opts(CANTOS, 'cantos');
    $('optFonte').innerHTML = opts(FONTES, 'fonte');
  }
  function aplicarATodas() {
    const c = state.cfg; let n = 0;
    lerIndice().forEach(i => {
      if (i.id === F.id) return;
      const o = lerJ(FK(i.id)); if (!o) return;
      o.cfg = Object.assign(cfgPadrao(), o.cfg || {}, { papel: c.papel, decor: c.decor, cantos: c.cantos, fonte: c.fonte });
      gravarJ(FK(i.id), o); n++;
    });
    $('msgTodas').textContent = n ? 'Visual aplicado em ' + n + ' folha' + (n === 1 ? '' : 's') + '.' : 'Não há outras folhas.';
  }
  function setEscala(v) { state.cfg.escala = Math.max(70, Math.min(160, Math.round(v))); salvar(); aplicarCfg(); }

  // ---------- regras de exibição ----------
  function atrasada(t) {
    if (t.feito || !t.fim) return false;
    if (tipo === 'lembretes') return t.fim < hojeISO() || (t.fim === hojeISO() && !!t.hora && t.hora < nowHM());
    return t.fim < hojeISO();
  }
  function visivel(t, f) {
    const h = hojeISO(), s0 = segundaISO(), s1 = addDias(s0, 6);
    if (f === 'feitas') return t.feito;
    if (t.feito) return false;
    if (f === 'tudo') return true;
    if (tipo === 'lembretes') {
      if (f === 'hoje') return !t.fim || t.fim <= h;
      if (f === 'proximos') return !!t.fim && t.fim > h;
      return true;
    }
    if (atrasada(t)) return true;
    if (f === 'hoje') return (!t.ini || t.ini <= h) && (!t.fim || t.fim >= h);
    if (f === 'semana') return (!t.ini || t.ini <= s1) && (!t.fim || t.fim >= s0);
    return true;
  }
  function ordenar(a, b) {
    if (tipo === 'lembretes') { const ka = (a.fim || '9999') + (a.hora || '99:99'), kb = (b.fim || '9999') + (b.hora || '99:99'); return ka < kb ? -1 : ka > kb ? 1 : a.id - b.id; }
    const ga = atrasada(a) ? 0 : (a.ini || a.fim) ? 1 : 2, gb = atrasada(b) ? 0 : (b.ini || b.fim) ? 1 : 2;
    const ka = a.fim || a.ini || '9999', kb = b.fim || b.ini || '9999';
    return (ga - gb) || (ka < kb ? -1 : ka > kb ? 1 : 0) || (a.id - b.id);
  }
  function textoDatas(t) {
    if (tipo === 'lembretes') return (t.fim || t.hora) ? '🔔 ' + [fmtData(t.fim), t.hora].filter(Boolean).join(' ') : '';
    if (t.ini && t.fim) return t.ini === t.fim ? '📅 ' + fmtData(t.ini) : '📅 ' + fmtData(t.ini) + ' → ' + fmtData(t.fim);
    if (t.ini) return '📅 desde ' + fmtData(t.ini);
    if (t.fim) return '📅 até ' + fmtData(t.fim);
    return '';
  }

  // ---------- render ----------
  function renderTopo() {
    const hr = new Date().getHours();
    const sauda = hr < 12 ? 'Bom dia' : hr < 18 ? 'Boa tarde' : 'Boa noite';
    let data = new Date().toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' });
    data = data.charAt(0).toUpperCase() + data.slice(1);
    $('saudacao').textContent = F.nome;
    $('subtitulo').textContent = `${sauda}, ${USUARIA} · ${data}`;
    document.title = F.nome + ' · Gege Post-it';
    const tot = state.tarefas.length, ok = state.tarefas.filter(t => t.feito).length;
    $('barraFill').style.width = (tot ? Math.round(ok / tot * 100) : 0) + '%';
    const un = tipo === 'lembretes' ? 'concluídos' : 'concluídas';
    $('progTxt').textContent = tot ? `${ok} de ${tot} ${un}` : (tipo === 'lembretes' ? 'Nenhum lembrete ainda' : 'Nenhuma tarefa ainda');
  }
  function renderAbas() {
    $('abas').innerHTML = FILTROS.map(([k, nome]) => {
      const n = state.tarefas.filter(t => visivel(t, k)).length;
      return `<button class="aba" role="tab" data-filtro="${k}" aria-selected="${k === state.filtro}">${nome}${n ? `<span class="n">${n}</span>` : ''}</button>`;
    }).join('');
  }
  function renderCats() {
    $('cats').innerHTML = CATS.map(([n, c]) => `<button class="chip" style="--c:var(${c})" data-cat="${n}" aria-pressed="${catSel === n}">${n}</button>`).join('');
  }
  function linhaTarefa(t) {
    if (t.id === editId) {
      const lemb = tipo === 'lembretes';
      return `<div class="tarefa editando" data-id="${t.id}">
        <input class="e-titulo" type="text" value="${esc(t.titulo)}" autocomplete="off">
        ${lemb ? '' : `<div class="e-cats">${CATS.map(([n, c]) => `<button class="chip" style="--c:var(${c})" data-ecat="${n}" aria-pressed="${editCat === n}">${n}</button>`).join('')}</div>`}
        <div class="e-datas"><label>${lemb ? 'Data' : 'Início'}<input class="e-ini" type="date" value="${(lemb ? t.fim : t.ini) || ''}"></label>
          ${lemb ? `<label>Hora<input class="e-hora" type="time" value="${t.hora || ''}"></label>` : `<label>Fim<input class="e-fim" type="date" value="${t.fim || ''}"></label>`}</div>
        <div class="e-botoes"><button class="btn" data-act="salvar">Salvar</button><button class="btn suave" data-act="cancelar">Cancelar</button><button class="btn suave" data-act="excluir">Excluir</button></div>
      </div>`;
    }
    const atr = atrasada(t), lemb = tipo === 'lembretes';
    const dt = textoDatas(t);
    const pill = !lemb && t.cat && corCat(t.cat) ? `<span class="cat" style="--c:var(${corCat(t.cat)})">${esc(t.cat)}</span>` : '';
    let aviso = '';
    if (atr) { const dias = diasEntre(t.fim, hojeISO()); aviso = `<span class="atraso">${lemb ? 'atrasado' : 'atrasada ' + dias + ' dia' + (dias === 1 ? '' : 's')}</span>`; }
    else if (!t.feito && t.fim === hojeISO()) aviso = `<span class="atraso" style="opacity:.8">${lemb ? 'hoje' : 'termina hoje'}</span>`;
    return `<div class="tarefa ${t.feito ? 'feito' : ''}" data-id="${t.id}">
      <input type="checkbox" class="bola" data-act="feito" ${t.feito ? 'checked' : ''} aria-label="Concluído">
      <div class="miolo"><div class="nome">${esc(t.titulo)}</div>${(pill || dt || aviso) ? `<div class="meta">${pill}${dt ? `<span>${dt}</span>` : ''}${aviso}</div>` : ''}</div>
      <button class="mini" data-act="editar" title="Editar">✎</button>
      <button class="mini" data-act="excluir" title="Excluir">✕</button>
    </div>`;
  }
  function renderLista() {
    const f = state.filtro, lemb = tipo === 'lembretes';
    const lista = state.tarefas.filter(t => visivel(t, f)).sort(f === 'feitas' ? ((a, b) => b.id - a.id) : ordenar);
    const feitas = f === 'feitas';
    $('resumo').textContent = lista.length ? `${lista.length} ${feitas ? (lemb ? 'concluído' : 'concluída') : 'pendente'}${lista.length === 1 ? '' : 's'}` : '';
    $('btnLimpar').hidden = !(feitas && lista.length);
    const vazios = lemb
      ? { hoje: 'Nenhum lembrete para hoje. 🔔', proximos: 'Nenhum lembrete futuro.', tudo: 'Escreva acima e aperte Enter ☝️', feitas: 'Nenhum lembrete concluído ainda.' }
      : { hoje: 'Nada para hoje por aqui. 🌿', semana: 'Nada planejado para esta semana.', tudo: 'Escreva acima e aperte Enter ☝️', feitas: 'Nenhuma tarefa concluída ainda.' };
    $('lista').innerHTML = lista.length ? lista.map(linhaTarefa).join('') : `<div class="vazio">${vazios[f]}</div>`;
  }
  // ---------- bloco de notas: só os títulos; abrir mostra o texto todo ----------
  const autoTam = (ta) => { ta.style.height = 'auto'; ta.style.height = Math.max(ta.scrollHeight + 2, 5 * 15) + 'px'; };
  function renderNotas() {
    if (tipo !== 'notas') return;
    const n = state.notas.length;
    $('nContagem').textContent = n ? `${n} nota${n === 1 ? '' : 's'}` : 'Nenhuma nota ainda';
    $('listaNotas').innerHTML = n ? state.notas.map(nt => {
      if (nt.id === editNotaId) return `<div class="nota-item" data-nid="${nt.id}"><div class="nota-cab"><span class="seta">${nt.aberta ? '▾' : '▸'}</span><input class="nota-edit" type="text" value="${esc(nt.titulo)}" autocomplete="off"></div></div>`;
      return `<div class="nota-item ${nt.aberta ? 'aberta' : ''}" data-nid="${nt.id}">
        <div class="nota-cab" data-nt="${nt.id}"><span class="seta">${nt.aberta ? '▾' : '▸'}</span><span class="nota-titulo" title="${esc(nt.titulo)}">${esc(nt.titulo)}</span>
          <button class="mini" data-ne="${nt.id}" title="Renomear">✎</button><button class="mini" data-nd="${nt.id}" title="Excluir nota">✕</button></div>
        ${nt.aberta ? `<textarea class="nota-texto" data-nid="${nt.id}" placeholder="Escreva aqui…" spellcheck="true">${esc(nt.texto)}</textarea>` : ''}
      </div>`;
    }).join('') : '<div class="vazio">Escreva um título acima e aperte Enter para criar a primeira nota.</div>';
    app.querySelectorAll('.nota-texto').forEach(autoTam);
  }
  function addNota() {
    const t = $('nTitulo').value.trim();
    if (!t) { $('nTitulo').focus(); return; }
    const nt = { id: state.seqN++, titulo: t, texto: '', aberta: true };
    state.notas.unshift(nt);
    $('nTitulo').value = ''; salvar(); renderNotas();
    const ta = app.querySelector(`.nota-texto[data-nid="${nt.id}"]`); if (ta) ta.focus();
  }
  function alternarNota(id) {
    const nt = state.notas.find(x => x.id === id); if (!nt) return;
    nt.aberta = !nt.aberta; salvar(); renderNotas();
    if (nt.aberta) { const ta = app.querySelector(`.nota-texto[data-nid="${id}"]`); if (ta) ta.focus(); }
  }
  function renomearNota(id) {
    editNotaId = id; renderNotas();
    const el = app.querySelector('.nota-edit'); if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
  }
  function fecharRenomear(salvarTxt) {
    if (editNotaId === null) return;
    const el = app.querySelector('.nota-edit'), nt = state.notas.find(x => x.id === editNotaId);
    if (salvarTxt && el && nt && el.value.trim()) nt.titulo = el.value.trim();
    editNotaId = null; salvar(); renderNotas();
  }
  function excluirNota(id) {
    const nt = state.notas.find(x => x.id === id); if (!nt) return;
    if (!confirm('Excluir a nota "' + nt.titulo + '"?')) return;
    state.notas = state.notas.filter(x => x.id !== id); salvar(); renderNotas();
  }
  function render() { renderTopo(); renderAbas(); renderLista(); renderCats(); renderNotas(); }

  // ---------- ações (tarefas e lembretes) ----------
  function adicionar() {
    const titulo = $('fTitulo').value.trim();
    if (!titulo) { $('fTitulo').focus(); return; }
    let t;
    if (tipo === 'lembretes') {
      const d = $('fIni').value;
      t = { id: state.seq++, titulo, cat: null, ini: d, fim: d, hora: $('fHora').value || '', feito: false, avisado: false };
      $('fHora').value = '';
    } else {
      const [ini, fim] = ordenaDatas($('fIni').value, $('fFim').value);
      t = { id: state.seq++, titulo, cat: catSel, ini, fim, feito: false };
      $('fFim').value = hojeISO();
    }
    state.tarefas.push(t);
    $('aviso').textContent = visivel(t, state.filtro) ? '' : 'Adicionado! Ainda não está na lista de hoje: veja em "' + FILTROS[1][1] + '" ou "' + FILTROS[2][1] + '".';
    $('fTitulo').value = ''; $('fIni').value = hojeISO();
    salvar(); render(); $('fTitulo').focus(); checarLembretes();
  }
  function salvarEdicao(card) {
    const t = state.tarefas.find(x => x.id === +card.dataset.id); if (!t) return;
    const titulo = card.querySelector('.e-titulo').value.trim();
    if (!titulo) { card.querySelector('.e-titulo').focus(); return; }
    if (tipo === 'lembretes') {
      const d = card.querySelector('.e-ini').value, h = card.querySelector('.e-hora').value;
      if (d !== t.fim || h !== (t.hora || '')) t.avisado = false;
      Object.assign(t, { titulo, ini: d, fim: d, hora: h });
    } else {
      const [ini, fim] = ordenaDatas(card.querySelector('.e-ini').value, card.querySelector('.e-fim').value);
      Object.assign(t, { titulo, ini, fim, cat: editCat });
    }
    editId = null; salvar(); render(); checarLembretes();
  }
  function abrirEdicao(id) {
    const t = state.tarefas.find(x => x.id === id); if (!t) return;
    editId = id; editCat = t.cat || null; renderLista();
    const el = app.querySelector('.e-titulo'); if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
  }

  // ---------- lembretes: aviso na hora marcada ----------
  function notificar(titulo, corpo) {
    if (App) App.notificar(titulo, corpo);
    else { try { if ('Notification' in window) { if (Notification.permission === 'default') Notification.requestPermission(); if (Notification.permission === 'granted') new Notification(titulo, { body: corpo }); } } catch (e) {} }
  }
  function checarLembretes() {
    if (tipo !== 'lembretes') return;
    const h = hojeISO(), agora = nowHM(); let mudou = false;
    state.tarefas.forEach(t => {
      if (t.feito || t.avisado || !t.hora || !t.fim) return;
      if (t.fim < h || (t.fim === h && t.hora <= agora)) { t.avisado = true; mudou = true; notificar('Lembrete', t.titulo + ' (' + t.hora + ')'); }
    });
    if (mudou) { salvar(); render(); }
  }
  setInterval(checarLembretes, 20000);

  // ---------- menu "Minhas folhas" ----------
  async function renderMenu() {
    const ix = lerIndice();
    const abertas = App ? await App.abertas() : [F.id];
    $('menu').innerHTML = '<h4>Minhas folhas</h4>' + ix.map(i => `<div class="menu-linha"><button class="menu-item" data-abrir="${i.id}">${(TIPOS[i.tipo] || {}).icone || '📄'} <span class="mn">${esc(i.nome)}</span><span class="st">${i.id === F.id ? 'esta' : abertas.includes(i.id) ? 'aberta' : 'fechada'}</span></button><button class="mini" data-excluir="${i.id}" title="Excluir folha">✕</button></div>`).join('')
      + '<hr><h4>Nova folha</h4>'
      + Object.keys(TIPOS).map(k => `<button class="menu-item" data-nova="${k}">${TIPOS[k].icone} ${TIPOS[k].nome}</button>`).join('')
      + (App ? '<hr><button class="menu-item" data-sair="1">⏻ Sair do programa</button>' : '');
  }
  async function criarEAbrir(t) {
    const N = novaFolha(t);
    if (App) await App.abrirFolha(N.id);
    else window.open(location.pathname + '?folha=' + N.id, '_blank', 'width=420,height=680');
    $('menu').hidden = true;
  }
  async function excluirFolha(id) {
    const ix = lerIndice();
    if (ix.length <= 1) { alert('Mantenha pelo menos uma folha.'); return; }
    const alvo = ix.find(i => i.id === id); if (!alvo) return;
    if (!confirm('Excluir a folha "' + alvo.nome + '" e tudo o que está nela?')) return;
    gravarJ(IDX, ix.filter(i => i.id !== id));
    try { localStorage.removeItem(FK(id)); } catch (e) {}
    if (id === F.id) { if (App) App.encerrarEsta(); else window.close(); return; }
    if (App) App.fecharFolha(id);
    renderMenu();
  }

  // ---------- eventos ----------
  app.addEventListener('click', async (e) => {
    const tg = e.target;
    const ab = tg.closest('[data-abrir]');
    if (ab) { const id = ab.dataset.abrir; if (id === F.id) { $('menu').hidden = true; return; } if (App) await App.abrirFolha(id); else window.open(location.pathname + '?folha=' + id, '_blank', 'width=420,height=680'); $('menu').hidden = true; return; }
    const ex = tg.closest('[data-excluir]'); if (ex) { excluirFolha(ex.dataset.excluir); return; }
    const nv = tg.closest('[data-nova]'); if (nv) { criarEAbrir(nv.dataset.nova); return; }
    if (tg.closest('[data-sair]')) { App && App.sair(); return; }
    if (tg.id === 'btnMenu') { const m = $('menu'); m.hidden = !m.hidden; if (!m.hidden) renderMenu(); return; }
    if (!tg.closest('#menu')) $('menu').hidden = true;
    const nd = tg.closest('[data-nd]'); if (nd) { excluirNota(+nd.dataset.nd); return; }
    const ne = tg.closest('[data-ne]'); if (ne) { renomearNota(+ne.dataset.ne); return; }
    const nt = tg.closest('[data-nt]'); if (nt && editNotaId === null) { alternarNota(+nt.dataset.nt); return; }
    if (tg.id === 'btnNota') { addNota(); return; }
    const f = tg.closest('[data-filtro]');
    if (f) { state.filtro = f.dataset.filtro; editId = null; salvar(); render(); return; }
    const chip = tg.closest('[data-cat]');
    if (chip) { catSel = (catSel === chip.dataset.cat) ? null : chip.dataset.cat; renderCats(); return; }
    const echip = tg.closest('[data-ecat]');
    if (echip) { editCat = (editCat === echip.dataset.ecat) ? null : echip.dataset.ecat; echip.parentNode.querySelectorAll('[data-ecat]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.ecat === editCat))); return; }
    const cf = tg.closest('[data-cfg]');
    if (cf) { const [k, v] = cf.dataset.cfg.split(':'); state.cfg[k] = v; if (k === 'decor' && TEMA_PAPEL[v]) state.cfg.papel = TEMA_PAPEL[v]; salvar(); aplicarCfg(); return; }
    if (tg.id === 'btnTodas') { aplicarATodas(); return; }
    if (tg.id === 'btnConfig') { $('painel').hidden = !$('painel').hidden; tg.classList.toggle('ativo', !$('painel').hidden); return; }
    if (tg.id === 'btnAdd') { adicionar(); return; }
    if (tg.id === 'btnLimpar') { state.tarefas = state.tarefas.filter(t => !t.feito); salvar(); render(); return; }
    const btn = tg.closest('[data-act]'); if (!btn || btn.type === 'checkbox') return;
    const card = btn.closest('.tarefa'); if (!card) return;
    const id = +card.dataset.id, act = btn.dataset.act;
    if (act === 'editar') abrirEdicao(id);
    else if (act === 'salvar') salvarEdicao(card);
    else if (act === 'cancelar') { editId = null; renderLista(); }
    else if (act === 'excluir') { state.tarefas = state.tarefas.filter(x => x.id !== id); if (editId === id) editId = null; salvar(); render(); }
  });
  app.addEventListener('change', (e) => {
    if (e.target.dataset.act === 'feito') {
      const t = state.tarefas.find(x => x.id === +e.target.closest('.tarefa').dataset.id); if (!t) return;
      t.feito = e.target.checked; salvar(); render();
    } else if (e.target.id === 'rNome') { syncIndice(); }
  });
  app.addEventListener('input', (e) => {
    if (e.target.id === 'rEsc') setEscala(+e.target.value);
    else if (e.target.id === 'rNome') { F.nome = e.target.value.trim() || TIPOS[tipo].nome; salvar(); renderTopo(); }
    else if (e.target.classList && e.target.classList.contains('nota-texto')) {
      const nt = state.notas.find(x => x.id === +e.target.dataset.nid);
      if (nt) { nt.texto = e.target.value; autoTam(e.target); clearTimeout(tmNota); tmNota = setTimeout(salvar, 300); }
    }
  });
  app.addEventListener('dblclick', (e) => {
    const n = e.target.closest('.nome'); if (n) { abrirEdicao(+n.closest('.tarefa').dataset.id); return; }
    const nt = e.target.closest('.nota-titulo'); if (nt) renomearNota(+nt.closest('.nota-item').dataset.nid);
  });
  app.addEventListener('keydown', (e) => {
    const t = e.target;
    if (t.classList && t.classList.contains('e-titulo')) {
      if (e.key === 'Enter') salvarEdicao(t.closest('.tarefa'));
      if (e.key === 'Escape') { editId = null; renderLista(); }
      return;
    }
    if (t.classList && t.classList.contains('nota-edit')) {
      if (e.key === 'Enter') fecharRenomear(true);
      if (e.key === 'Escape') fecharRenomear(false);
      return;
    }
    if (e.key === 'Enter' && t.id === 'nTitulo') { addNota(); return; }
    if (e.key === 'Enter' && (t.id === 'fTitulo' || t.id === 'fIni' || t.id === 'fFim' || t.id === 'fHora')) adicionar();
    if (e.key === 'Escape') $('menu').hidden = true;
  });
  app.addEventListener('wheel', (e) => { if (e.ctrlKey) { e.preventDefault(); setEscala(state.cfg.escala + (e.deltaY < 0 ? 5 : -5)); } }, { passive: false });
  document.addEventListener('keydown', (e) => {
    if (!e.ctrlKey) return;
    if (e.key === '+' || e.key === '=') { e.preventDefault(); setEscala(state.cfg.escala + 5); }
    else if (e.key === '-') { e.preventDefault(); setEscala(state.cfg.escala - 5); }
    else if (e.key === '0') { e.preventDefault(); setEscala(100); }
  });
  window.addEventListener('storage', (e) => {
    if (e.key === IDX && !$('menu').hidden) renderMenu();
    if (e.key === FK(F.id) && e.newValue) {            // outra janela aplicou um visual a esta folha
      try { const n = JSON.parse(e.newValue).cfg; Object.assign(state.cfg, { papel: n.papel, decor: n.decor, cantos: n.cantos, fonte: n.fonte }); aplicarCfg(); renderCats(); } catch (err) {}
    }
  });

  // ---------- recados (texto livre) ----------
  const rec = $('recado');
  rec.value = F.texto || '';
  let tmRec = null;
  rec.addEventListener('input', () => { F.texto = rec.value; clearTimeout(tmRec); tmRec = setTimeout(salvar, 300); });
  window.addEventListener('beforeunload', () => {
    if (tipo === 'recados') { F.texto = rec.value; salvar(); }
    else if (tipo === 'notas' && tmNota) { clearTimeout(tmNota); salvar(); }
  });
  app.addEventListener('focusout', (e) => { if (e.target.classList && e.target.classList.contains('nota-edit')) fecharRenomear(true); });

  // ---------- janela / atualização ----------
  if (App) {
    document.body.classList.add('app');
    const MODOS = [['fundo', 'Só na área de trabalho'], ['normal', 'Normal'], ['cima', 'Sempre por cima']];
    const ENCAIXES = [['esquerda', '◀ Lateral esq.'], ['direita', 'Lateral dir. ▶'], ['rodape', '▼ Rodapé']];
    const mostrarModo = (m) => {
      $('btnFixar').classList.toggle('ativo', m === 'cima');
      $('optModo').innerHTML = MODOS.map(([k, n]) => `<button class="opt" data-modo="${k}" aria-pressed="${m === k}">${n}</button>`).join('');
    };
    App.getModo().then(mostrarModo);
    $('optEncaixe').innerHTML = ENCAIXES.map(([k, n]) => `<button class="opt" data-encaixe="${k}">${n}</button>`).join('');
    app.addEventListener('click', async (e) => {
      const mo = e.target.closest('[data-modo]'); if (mo) { mostrarModo(await App.setModo(mo.dataset.modo)); return; }
      const en = e.target.closest('[data-encaixe]'); if (en) { App.encaixar(en.dataset.encaixe); return; }
      if (e.target.id === 'btnFixar') { const atual = await App.getModo(); mostrarModo(await App.setModo(atual === 'cima' ? 'fundo' : 'cima')); }
    });
    App.getAuto().then(v => { $('chkAuto').checked = v; });
    App.versao().then(v => { $('ver').textContent = 'Versão ' + v; });
    App.onDisponivel(v => { $('updTxt').textContent = 'Nova versão ' + v + ' encontrada. Baixando...'; $('btnUpd').hidden = true; $('upd').classList.add('on'); });
    App.onAtualizacao(v => { $('updTxt').textContent = 'Nova versão ' + v + ' pronta.'; $('btnUpd').hidden = false; $('upd').classList.add('on'); });
    $('btnChecar').onclick = async () => {
      $('chkMsg').textContent = 'verificando...';
      const r = await App.checar();
      $('chkMsg').textContent = r === 'atual' ? 'Você está na versão mais recente.' : r === 'nova' ? 'Nova versão encontrada!' : r === 'erro' ? 'Não foi possível verificar agora.' : '(só no programa instalado)';
    };
    $('btnUpd').onclick = () => App.instalarAtualizacao();
    $('btnFechar').onclick = async () => { await App.fechar(); mostrarModo(await App.getModo()); };
    $('chkAuto').onchange = (e) => App.setAuto(e.target.checked);
  }

  // ---------- início ----------
  $('rNome').value = F.nome;
  $('fTitulo').placeholder = tipo === 'lembretes' ? '＋ Escreva um lembrete…' : '＋ Escreva uma tarefa…';
  $('lblIni').textContent = tipo === 'lembretes' ? 'Data' : 'Início';
  $('dicaTipo').textContent = tipo === 'recados' ? 'Tudo o que você escreve é salvo automaticamente.' : tipo === 'lembretes' ? 'Lembretes com hora avisam no Windows enquanto esta folha estiver aberta (pode ficar minimizada).' : tipo === 'notas' ? 'Clique no título para abrir ou fechar a nota; duplo clique no título (ou ✎) para renomear. O texto salva sozinho.' : 'Clique em ✎ (ou duas vezes no texto) para editar uma tarefa.';
  $('fIni').value = hojeISO(); $('fFim').value = hojeISO();
  aplicarCfg(); salvar(); render(); checarLembretes();
})();
</script>
</body>
</html>
